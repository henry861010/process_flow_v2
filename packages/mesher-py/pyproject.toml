[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "process-flow-mesher"
version = "0.1.0"
description = "Mesh and text CDB export utilities for process-flow geometry."
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "mesher==0.1.0",
  "numpy>=1.26",
  "process-flow-kernel",
]

[project.optional-dependencies]
visualization = [
  "pyvista>=0.48",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["process_flow_mesher*"]

[tool.setuptools.package-data]
process_flow_mesher = ["py.typed"]
